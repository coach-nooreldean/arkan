name: arkan
description: "أركان - تطبيقك الإسلامي اليومي لمواقيت الصلاة والمصحف الشريف والأذكار والعبادات"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation & State
  go_router: ^17.1.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  fpdart: ^1.2.0

  # Storage & Utilities
  shared_preferences: ^2.5.4
  path_provider: ^2.1.4
  intl: ^0.20.2
  uuid: ^4.5.3
  dio: ^5.9.2
  easy_localization: ^3.0.8
  share_plus: ^10.1.4

  # UI, Icons, Fonts & Effects
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  iconsax_plus: ^1.0.0
  hugeicons: ^1.1.7
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.4
  flutter_animate: ^4.5.2
  skeletonizer: ^2.1.3
  universal_io: ^2.3.1

  # Audio & Media
  audioplayers: ^6.6.0
  just_audio: ^0.10.5

  # Notifications & Sensors
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  geolocator: ^14.0.2
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
    - assets/audio/
    - assets/translations/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  windows:
    generate: true
    image_path: "assets/images/logo.png"
  macos:
    generate: true
    image_path: "assets/images/logo.png"
  linux:
    generate: true
    image_path: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#0B0F19"
    theme_color: "#3551AE"
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#0B0F19"
  adaptive_icon_foreground: "assets/images/logo.png"
  remove_alpha_ios: true
